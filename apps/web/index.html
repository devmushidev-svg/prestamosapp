<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MultiPréstamos — Gestión de préstamos</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Alinear con --pf-theme-color en src/index.css -->
    <meta name="theme-color" content="#fff7ed" />
    <!-- Aplica el tema guardado antes de la primera pintura (evita el destello claro con tema oscuro). Valores válidos: data-set de PF_THEME_PRESETS en src/theme/pfTheme.ts. -->
    <script>
      try {
        var pfTheme = localStorage.getItem("pf-theme");
        if (pfTheme === "slate" || pfTheme === "ocean" || pfTheme === "dark") {
          document.documentElement.dataset.pfTheme = pfTheme;
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MultiPréstamos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
